[project]
name = "international-marketing-analytics"
version = "2026.1"
description = "Course materials for International Marketing Analytics (MSc International Management / CEMS, WU Vienna)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.30,<2",
    "pyarrow>=18",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "linearmodels>=6.0",
    "pymc-marketing>=0.19",
    "arviz>=0.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "plotnine>=0.15",
    "great-tables>=1.0",
    "openpyxl>=3.1",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["assignments/checks"]
